name: Validate and deploy with Komodo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  deploy:
    needs: validate
    runs-on: self-hosted
    permissions: {}
    steps:
      - name: Trigger internal Komodo deployment
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "${KOMODO_WEBHOOK_URL}"
